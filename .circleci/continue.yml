# Continuation of .circleci/config.yml. Both jobs are always part of the `ci`
# workflow so `ci-summary` can be the one required check; a job whose area did
# not change finishes in seconds without checking out or installing anything.
#
# npm staging (publish.yml) stays on GitHub Actions: npm trusted publishing
# authenticates with GitHub's OIDC token.
version: 2.1

parameters:
  docs:
    type: boolean
    default: false
  package:
    type: boolean
    default: false

executors:
  bun:
    docker:
      - image: cimg/node:24
    resource_class: medium

commands:
  only-if:
    description: Run `steps` when `condition` holds; otherwise finish immediately.
    parameters:
      condition:
        type: boolean
      steps:
        type: steps
    steps:
      - when:
          condition: << parameters.condition >>
          steps: << parameters.steps >>
      - unless:
          condition: << parameters.condition >>
          steps:
            - run:
                name: Nothing relevant changed
                command: echo "No changes in this job's paths; skipping."

  setup-bun:
    steps:
      - restore_cache:
          keys:
            - bun-v1-{{ arch }}-1.3.11-{{ checksum "bun.lock" }}
            - bun-v1-{{ arch }}-1.3.11-
      - run:
          name: Install Bun
          command: |
            if [ "$("$HOME/.bun/bin/bun" --version 2>/dev/null)" != 1.3.11 ]; then
              curl -fsSL https://bun.sh/install | bash -s bun-v1.3.11
            fi
            # The cache restores bun but not its bunx symlink.
            ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ arch }}-1.3.11-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun

jobs:
  package:
    executor: bun
    steps:
      - only-if:
          condition: << pipeline.parameters.package >>
          steps:
            - checkout
            - setup-bun
            - run: bun --filter=@hiyorios/kaji run format:check
            - run: bun --filter=@hiyorios/kaji run lint
            - run: bun --filter=@hiyorios/kaji run typecheck
            - run: bun --filter=@hiyorios/kaji run test
            - run: bun --filter=@hiyorios/kaji run build
            - run: bun run readme:check
            - run: bun --filter=@hiyorios/kaji run package:check
            - run: bun --filter=@hiyorios/kaji run package:smoke
            - run: bun --filter=@hiyorios/kaji-example-refund run typecheck
            - run: bun run example:refund

  # Cloudflare Pages' git integration also rebuilds kaji.build from main; the
  # deploy here runs only on main and only once CLOUDFLARE_API_TOKEN is set as
  # a project environment variable.
  docs:
    executor: bun
    environment:
      CLOUDFLARE_ACCOUNT_ID: 4539a31e679685d4237a7bfe2dabcf0b
    steps:
      - only-if:
          condition: << pipeline.parameters.docs >>
          steps:
            - checkout
            - setup-bun
            - run: bun --filter=@kaji/docs run format:check
            - run: bun --filter=@kaji/docs run lint
            - run: bun --filter=@kaji/docs run typecheck
            - run: bun --filter=@kaji/docs run build
            - when:
                condition:
                  equal: [main, << pipeline.git.branch >>]
                steps:
                  - run:
                      name: Deploy to Cloudflare Pages
                      command: |
                        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                          echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
                          exit 0
                        fi
                        bunx wrangler@4.135.0 pages deploy apps/docs/dist --project-name kaji-docs --branch main

  ci-summary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "All required CI jobs passed."

workflows:
  ci:
    jobs:
      - package
      - docs
      - ci-summary:
          requires: [package, docs]

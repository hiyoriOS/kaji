name: Docs site

# Only a real change under apps/docs (or to this workflow) starts the
# docs motion: verify and build the site. Publishing itself is owned by
# the Cloudflare Pages git integration, which rebuilds kaji.build from
# the same pushes to main. Runs on a Blacksmith runner (billed by
# Blacksmith, not GitHub Actions minutes).
on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/docs-site.yml"
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

# Publishing is the push-to-main half of the docs motion. It stays gated
# on CLOUDFLARE_API_TOKEN so pushes do not fail before the secret exists;
# once the secret is set, every qualifying push deploys automatically.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 4539a31e679685d4237a7bfe2dabcf0b

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun --filter=@kaji/docs run format:check
      - run: bun --filter=@kaji/docs run lint
      - run: bun --filter=@kaji/docs run typecheck
      - run: bun --filter=@kaji/docs run build
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.CLOUDFLARE_API_TOKEN != ''
        run: >-
          bunx wrangler@4.135.0 pages deploy apps/docs/dist
          --project-name kaji-docs --branch main

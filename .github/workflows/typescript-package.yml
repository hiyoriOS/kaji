name: TypeScript package

# Package checks run only when something the package depends on changes.
# Docs-only changes are verified by the docs-site workflow instead.
on:
  pull_request:
    paths:
      - "README.md"
      - "packages/ts/**"
      - "examples/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/typescript-package.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "packages/ts/**"
      - "examples/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/typescript-package.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun --filter=@hiyorios/kaji run format:check
      - run: bun --filter=@hiyorios/kaji run lint
      - run: bun --filter=@hiyorios/kaji run typecheck
      - run: bun --filter=@hiyorios/kaji run test
      - run: bun --filter=@hiyorios/kaji run build
      - run: bun run readme:check
      - run: bun --filter=@hiyorios/kaji run package:check
      - run: bun --filter=@hiyorios/kaji run package:smoke
      - run: bun --filter=@hiyorios/kaji-example-refund run typecheck
      - run: bun run example:refund

# npm staged release for @hiyorios/kaji.
#
# A human dispatches this workflow from main. It runs the full release gate,
# then stages the exact verified artifact to npm's private staging area. It
# never publishes: the staged version becomes public only when a maintainer
# runs `npm stage approve <stage-id>` interactively with 2FA. Trusted
# publishing (OIDC) is used for staging, so no npm token exists anywhere.
#
# External prerequisite (ops/npm-trusted-publishing): the npm trusted
# publisher for @hiyorios/kaji must allow `npm stage publish` from this
# workflow file (publish.yml) and the `npm-release` environment.

name: npm release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Dist-tag to stage. next = prerelease only, latest = stable only."
        type: choice
        required: true
        default: next
        options:
          - next
          - latest

# id-token: write lets GitHub mint the OIDC token npm exchanges for a
# short-lived publish credential. No npm token is used or stored.
permissions:
  contents: read
  id-token: write

# One release at a time. A second dispatch queues; it never cancels or
# replaces an active staging run.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage @hiyorios/kaji
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 30
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Refuse to run outside main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::npm staging runs only from main, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Staged publishing is GA since npm 11.15.0 (needs Node >= 22.14).
      # Pinned to 11.19.0: the version verified against `npm stage` locally,
      # so the workflow does not depend on the runner image's npm.
      - name: Pin npm CLI
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      # Release gate. These are the repository's own commands, identical to
      # the CircleCI `package` job, so a green CI on main implies these pass.
      # Build precedes typecheck: the example workspace's tsc resolves
      # @hiyorios/kaji through dist/index.d.mts, which does not exist in a
      # pristine checkout.
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (including failure and concurrency semantics)
        run: bun run test
      - name: Package validation (publint + attw)
        run: bun run package:check
      - name: Consumer smoke (tarball install, runtime + strict TypeScript)
        run: bun run package:smoke
      - name: Proof example (refund lifecycle against the package)
        run: bun run example:refund

      # Assert name/private/semver/channel rules and confirm the exact
      # version is absent from the public registry before anything is sent.
      - name: Assert release inputs
        run: node tooling/scripts/assert-release-inputs.mjs --channel "$CHANNEL" --package-dir packages/ts

      # Pack once, then validate those exact bytes. The tarball produced
      # here is what gets staged below; nothing rebuilds in between.
      - name: Pack and validate the staged artifact
        run: |
          mkdir -p /tmp/kaji-stage
          npm pack ./packages/ts --pack-destination /tmp/kaji-stage
          TARBALL=$(ls /tmp/kaji-stage/*.tgz)
          echo "STAGED_TARBALL=$TARBALL" >> "$GITHUB_ENV"
          sha256sum "$TARBALL" | tee artifact-sha256.txt
          bunx publint "$TARBALL"
          bunx attw "$TARBALL" --profile esm-only

      # Stages the validated tarball itself. `npm stage publish` shares
      # npm publish's spec handling (verified in npm 11.19.0 source), so the
      # staged bytes are exactly the bytes the gate approved. OIDC
      # authenticates via the npm-release environment trust; no token.
      # npm's oidc() helper fails silently when the exchange is rejected
      # (surface symptom: ENEEDAUTH), so assert the OIDC env up front and
      # log verbosely here to capture npm's rejection reason.
      - name: Stage package (publication deferred to human approval)
        env:
          npm_config_loglevel: verbose
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::ACTIONS_ID_TOKEN_* missing: the job lacks id-token: write, so OIDC staging cannot authenticate"
            exit 1
          fi
          npm stage publish "$STAGED_TARBALL" --tag "$CHANNEL" --access public --provenance

      - name: Report staged release
        if: always()
        run: |
          PACKAGE=$(node -p "require('./packages/ts/package.json').name")
          VERSION=$(node -p "require('./packages/ts/package.json').version")
          {
            echo "## Staged npm release"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| package | $PACKAGE |"
            echo "| version | $VERSION |"
            echo "| channel | $CHANNEL |"
            echo "| source sha | $GITHUB_SHA |"
            echo "| artifact | ${STAGED_TARBALL:-not staged} |"
            echo "| run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo ""
            echo "Staged packages:"
            echo ""
            echo '```'
            (npm stage list "$PACKAGE" --json 2>/dev/null || npm stage list "$PACKAGE" || echo "(run npm stage list locally)")
            echo '```'
            echo ""
            echo "Nothing is public yet. Inspect and approve interactively:"
            echo ""
            echo '```'
            echo "npm stage view <stage-id>"
            echo "npm stage download <stage-id>"
            echo "npm stage approve <stage-id>   # publishes; requires 2FA"
            echo "npm stage reject <stage-id>    # discards; requires 2FA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
